#
# TEMPORARY probe, deleted before merge. It exists because the sandbox that
# edits this branch has no Rust toolchain: the only authoritative answer to
# "what does CI's rustfmt want" is CI's rustfmt. It formats the tree and pushes
# the result back to the same branch instead of only failing.

name: fmt-probe

on:
  push:
    branches: [arena/392cabeb-odina]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/392cabeb-odina
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: format, test and push
        run: |
          cargo fmt --all
          set +e
          cargo test --workspace --locked > /tmp/test.log 2>&1
          echo "TEST_EXIT=$?" >> /tmp/test.log
          set -e
          {
            echo '```'
            grep -E "^(test .* FAILED|failures:|---- .* stdout ----|TEST_EXIT=|error(\[|:)|running [0-9]+ test|test result:)" /tmp/test.log | head -200
            echo '```'
          } > test-report.md
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to push"
            exit 0
          fi
          git config user.name "odina-fmt-probe"
          git config user.email "fmt-probe@users.noreply.github.com"
          git commit -m "chore: probe output (format + failing test names)"
          git push origin HEAD:arena/392cabeb-odina
