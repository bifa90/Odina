#
# TEMPORARY probe, deleted before merge. The sandbox that edits this branch has
# no Rust toolchain, so the only authoritative fmt/clippy/test answer is CI's.

name: fmt-probe

on:
  push:
    branches: [arena/3d795d06-odina]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/3d795d06-odina
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: format, check, test and push
        run: |
          cargo fmt --all
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > clippy.log 2>&1
          CLIPPY_EXIT=$?
          cargo test --workspace > test.log 2>&1
          TEST_EXIT=$?
          set -e
          {
            echo '# probe output'
            echo
            echo "clippy exit: $CLIPPY_EXIT"
            echo '```'
            head -c 9000 clippy.log
            echo '```'
            echo "test exit: $TEST_EXIT"
            echo '```'
            grep -E "FAILED|test result:|^error|panicked" test.log | head -40
            echo '```'
          } > probe-report.md
          rm -f clippy.log test.log
          cat probe-report.md
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to push"
            exit 0
          fi
          git config user.name "odina-fmt-probe"
          git config user.email "fmt-probe@users.noreply.github.com"
          git commit -m "chore: probe output (format + clippy + failing tests)"
          git push origin HEAD:arena/3d795d06-odina
