#
# TEMPORARY probe, deleted before merge. The sandbox that edits this branch has
# no Rust toolchain, so the only authoritative fmt/clippy/test answer is CI's.
# It formats the tree, records what clippy and the tests said, and pushes both
# back to the same branch instead of only failing.

name: fmt-probe

on:
  push:
    branches: [arena/3d795d06-odina]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/3d795d06-odina
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: format, check, test and push
        run: |
          cargo fmt --all
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > /tmp/clippy.log 2>&1
          CLIPPY_EXIT=$?
          cargo test --workspace > /tmp/test.log 2>&1
          TEST_EXIT=$?
          set -e
          {
            echo '# probe output'
            echo
            echo "clippy exit: $CLIPPY_EXIT"
            echo '```'
            grep -E "^(error|warning|help)|^\s+--> |^[a-z0-9_]+\.rs:[0-9]+" /tmp/clippy.log | head -160
            echo '```'
            echo "test exit: $TEST_EXIT"
            echo '```'
            grep -E "^(test .* FAILED|failures:|---- .* stdout ----|error(\[|:)|running [0-9]+ test|test result:)" /tmp/test.log | head -160
            echo '```'
          } > probe-report.md
          cat probe-report.md
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to push"
            exit 0
          fi
          git config user.name "odina-fmt-probe"
          git config user.email "fmt-probe@users.noreply.github.com"
          git commit -m "chore: probe output (format + clippy + failing tests)"
          git push origin HEAD:arena/3d795d06-odina
