name: fmt-probe
on:
  push:
    paths:
      - ".github/workflows/fmt-probe.yml"
permissions:
  checks: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: report the exact formatting diff
        run: |
          cargo fmt --all
          git diff --color=never > /tmp/fmt.diff || true
          python3 - <<'PY'
          import pathlib
          text = pathlib.Path('/tmp/fmt.diff').read_text()
          text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error title=fmt::' + text[:60000])
          PY
