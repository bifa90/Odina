#
# Builds the artifacts — the public build, the check build and their shared data — and puts
# them where they can be downloaded. This is the only place either binary is
# produced for release: the Windows runner is the compiler of record
# (docs/ci.md §2.10), not a developer’s local simulation.
#
# The check build is labelled in the file name, in the artifact name and in a
# README that ships inside the archive, because §34.3 says it must never be
# mistaken for something an end user should run.

name: build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, if the artifacts should also be attached to a release"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.kind }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: public
            features: ""
            exe: odina.exe
            artifact: odina-public-windows-x64
          - kind: check
            exe: odina-check.exe
            artifact: odina-CHECK-BUILD-windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.kind }}

      - name: build
        shell: pwsh
        env:
          # D113: the release month is baked in at compile time, so the age the
          # UI prints cannot be moved without a new signed build. Never read
          # from a file's modification time.
          ODINA_RELEASE_MONTH: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          # An explicit tag wins when one was given; otherwise the month of the
          # commit being built. Same format either way: YYYY-MM.
          $month = if ($env:ODINA_RELEASE_MONTH -match '\d{4}-\d{2}') {
            $env:ODINA_RELEASE_MONTH.Substring(0, 7)
          } else {
            git show -s --format=%cd --date=format:%Y-%m HEAD
          }
          $env:ODINA_RELEASE_MONTH = $month
          Write-Output "release month: $month"
          # `${{ matrix.features }}` is empty for the public build, and an empty
          # argument must not become a stray word on the command line.
          if ("${{ matrix.kind }}" -eq "check") {
            cargo build --release --locked --package odina-cli --features instrument *> build.log
          } else {
            cargo build --release --locked --package odina-cli *> build.log
          }
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content build.log -Tail 20) -join " <NL> "
            Write-Output "::error::BUILD $tail"
            exit 1
          }
          Get-Content build.log -Tail 3

      - name: prove the public build carries no measurement code
        if: matrix.kind == 'public'
        shell: pwsh
        run: |
          # The script is the same gate CI runs, but here it runs against the
          # real release binary rather than the source tree: a string that only
          # appears after linking is exactly what the textual check cannot see.
          python tools/ci/check-public-build.py *> gate.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content gate.log -Tail 25) -join " <NL> "
            Write-Output "::error::GATE $tail"
            exit 1
          }
          Get-Content gate.log -Tail 3
          $tree = cargo tree -p odina-cli --edges normal
          foreach ($crate in @("odina-report", "odina-instrument")) {
            if ($tree -match $crate) {
              Write-Error "$crate appears in the public build's dependency tree"
              exit 1
            }
          }

      - name: name, label and archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "stage-${{ matrix.kind }}"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item "target/release/odina.exe" "$stage/${{ matrix.exe }}"

          if ("${{ matrix.kind }}" -eq "check") {
            @(
              'odina - CHECK BUILD (nuskha al-fahs)',
              '=====================================',
              '',
              'This is NOT a release build. Do not give it to anyone.',
              '',
              'It is the public build plus the measurement layer described in',
              'docs/instrumented-build.md. It:',
              '',
              '  - writes ONE local JSON file when you run:',
              '        odina-check.exe check <folder>',
              '  - sends nothing over the network: there is no socket and no URL',
              '    anywhere in the source that builds it',
              '  - is labelled CHECK BUILD everywhere it appears, on purpose',
              '',
              'Run it, read the file it produces, and send that file back - or',
              'delete it and nothing happens. docs/review-instrumented.md says',
              'what happens to it next.',
              '',
              'Commit: ${{ github.sha }}'
            ) | Set-Content -Path "$stage/READ-ME-FIRST.txt" -Encoding utf8
          }

          $zip = "${{ matrix.artifact }}.zip"
          python tools/package-windows.py $stage "${{ matrix.exe }}" $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: test the component in the extracted download
        shell: pwsh
        run: |
          Expand-Archive "${{ matrix.artifact }}.zip" unpack
          if (-not (Test-Path "unpack/components/repair/odina-repair-v1.tsv")) {
            Expand-Archive odina-repair-v1-r1.zip unpack -Force
          }
          & "./unpack/${{ matrix.exe }}" repair-db --demo
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        if: matrix.kind == 'public'
        with:
          name: odina-repair-v1-r1
          path: |
            odina-repair-v1-r1.zip
            odina-repair-v1-r1.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
          if-no-files-found: error
          retention-days: 90

  release:
    name: attach the tested downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: odina-*
          path: downloads
          merge-multiple: true
      - name: publish one prerelease from both builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd downloads
          for name in odina-public-windows-x64 odina-CHECK-BUILD-windows-x64 odina-repair-v1-r1; do
            sha256sum -c "$name.zip.sha256"
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --prerelease --title "Odina $TAG" --notes-file ../RELEASE-NOTES.md
          fi
          gh release upload "$TAG" ./*.zip ./*.zip.sha256 --clobber
