#
# The window builds on both systems the owner uses: Ubuntu where it is
# developed, Windows 11 where it is sold. This job proves the code compiles and
# its tests pass; it publishes nothing.
name: shell
on:
  push:
    paths:
      - "src-tauri/**"
      - "crates/**"
      - "locales/**"
      - "tools/fetch-shell-fonts.py"
      - ".github/workflows/shell.yml"
  pull_request:
    paths:
      - "src-tauri/**"
jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: webkit and friends (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - name: fonts for the bundle
        run: python3 ../tools/fetch-shell-fonts.py
      - name: format
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if cargo fmt -- --check; then exit 0; fi
          cargo fmt
          git diff --color=never > /tmp/fmt.diff
          python3 - <<'PY'
          import pathlib
          text = pathlib.Path('/tmp/fmt.diff').read_text()
          text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error title=fmt::' + text[:60000])
          PY
          exit 1
      - name: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets -- -D warnings > /tmp/clippy.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -iE "error(\[|:)|^error|-->|panicked|cannot|expected|mismatched" /tmp/clippy.log \
              | head -30 | sed 's/^/::error title=clippy::/'
            tail -12 /tmp/clippy.log | sed 's/^/::error title=clippy-tail::/'
          fi
          exit "$status"
      - name: test
        run: cargo test
      - name: build
        run: cargo build --release
