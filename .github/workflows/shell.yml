#
# The window builds on both systems the owner uses: Ubuntu where it is
# developed, Windows 11 where it is sold. This job proves the code compiles and
# its tests pass; it publishes nothing.
name: shell
on:
  push:
    paths:
      - "src-tauri/**"
      - "crates/**"
      - "locales/**"
      - "tools/fetch-shell-fonts.py"
      - ".github/workflows/shell.yml"
  pull_request:
    paths:
      - "src-tauri/**"
jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: webkit and friends (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - name: fonts for the bundle
        run: python3 ../tools/fetch-shell-fonts.py
      - name: format
        if: runner.os == 'Linux'
        run: cargo fmt -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: build
        run: cargo build --release
