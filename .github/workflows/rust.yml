#
# The Rust workspace builds and its tests pass on every push. This is gate G0
# from docs/roadmap.md: until it is green, "we will write the app in Rust" is
# a claim rather than a fact.

name: rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: clippy
        run: |
          # Both crates, both feature sets, one log file. The log exists because
          # a failing step whose output cannot be read costs a whole CI cycle:
          # the diagnostics step below turns it into annotations.
          set +e
          cargo clippy --workspace --all-targets --locked -- -D warnings > clippy.log 2>&1
          a=$?
          cargo clippy --package odina-cli --features instrument --all-targets --locked -- -D warnings >> clippy.log 2>&1
          b=$?
          echo "WORKSPACE_EXIT=$a" >> clippy.log
          echo "INSTRUMENT_EXIT=$b" >> clippy.log
          cat clippy.log
          if [ "$a" -ne 0 ] || [ "$b" -ne 0 ]; then exit 1; fi

      - name: clippy diagnostics
        if: failure()
        run: python3 tools/ci/clippy-why.py

      - name: build
        run: cargo build --workspace --locked

      - name: test
        run: cargo test --workspace --locked

      # The instrumented build is a second build of the same source, and it is
      # NOT covered by the workspace test above unless it is built on purpose.
      # It gets built, linted and tested here so "the check build compiles" is
      # a fact CI maintains rather than a claim made once.
      - name: check build (instrumented)
        run: |
          cargo build --package odina-cli --features instrument --locked
          cargo test --package odina-cli --features instrument --locked

      - name: doc
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --doc --locked
