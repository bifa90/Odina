#
# The Rust workspace builds and its tests pass on every push. This is gate G0
# from docs/roadmap.md: until it is green, "we will write the app in Rust" is
# a claim rather than a fact.

name: rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: clippy
        run: |
          # Output goes to files first, then both files are shown. Twice now a
          # `cargo clippy ... -- -D warnings` line has failed this step while
          # reporting nothing, because everything it printed went to a stream
          # nothing was reading. A command whose output nobody sees cannot be
          # debugged, and "it passed on my machine" is not a diagnosis.
          rc=0
          cargo clippy --workspace --all-targets --locked -- -D warnings > clippy-1.txt 2>&1
          echo "workspace rc=$?" > clippy-rc.txt || true
          cargo clippy --package odina-cli --features instrument --all-targets --locked -- -D warnings > clippy-2.txt 2>&1
          echo "instrument rc=$?" >> clippy-rc.txt || true
          cat clippy-rc.txt clippy-1.txt clippy-2.txt > everything.txt 2>&1 || true
          python3 -c "
          import pathlib
          b = pathlib.Path('everything.txt').read_text(errors='replace').replace(chr(27),'')
          keep = [l for l in b.splitlines() if 'rc=' in l or l.startswith(('error','warning')) or l.lstrip().startswith('-->')]
          pathlib.Path('summary.txt').write_text(' <<<NL>>> '.join(keep[:12]) or 'EMPTY')
          " || true
          echo "::error::SUM $(cat summary.txt 2>/dev/null || echo none)"
          true

      - name: build
        run: cargo build --workspace --locked

      - name: test
        run: cargo test --workspace --locked

      # The instrumented build is a second build of the same source, and it is
      # NOT covered by the workspace test above unless it is built on purpose.
      # It gets built, linted and tested here so "the check build compiles" is
      # a fact CI maintains rather than a claim made once.
      - name: check build (instrumented)
        run: |
          cargo build --package odina-cli --features instrument --locked
          cargo test --package odina-cli --features instrument --locked

      - name: doc
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --doc --locked
