#
# The Rust workspace builds and its tests pass on every push. This is gate G0
# from docs/roadmap.md: until it is green, "we will write the app in Rust" is
# a claim rather than a fact.

name: rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # A key of its own: the default key is shared across every workflow on the
      # same branch, so a cache written by an earlier run — including a run that
      # has since been reverted — can be restored here and lint code that no
      # longer exists. That is what made this job fail while an identical job
      # passed in another workflow.
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ matrix.os }}-v2

      - name: format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings > /tmp/c1.txt 2>&1 || true
          cargo clippy --package odina-cli --features instrument --all-targets --locked -- -D warnings > /tmp/c2.txt 2>&1 || true
          python3 -c "
          import pathlib
          out=[]
          for f in ('/tmp/c1.txt','/tmp/c2.txt'):
              b=pathlib.Path(f).read_text(errors='replace').replace(chr(27),'')
              out += [l for l in b.splitlines() if l.startswith(('error','warning')) or l.lstrip().startswith('-->')]
          print(' <<<NL>>> '.join(out[:10]) if out else 'CLEAN')
          pathlib.Path('/tmp/n.txt').write_text(' <<<NL>>> '.join(out[:10])[:1400] or 'CLEAN')
          "
          cat /tmp/n.txt
          if grep -qE '^error' /tmp/c1.txt /tmp/c2.txt; then
            echo "::error::CLIPPY $(cat /tmp/n.txt)"
            exit 1
          fi

      - name: build
        run: cargo build --workspace --locked

      - name: test
        run: cargo test --workspace --locked

      # The instrumented build is a second build of the same source, and it is
      # NOT covered by the workspace test above unless it is built on purpose.
      # It gets built, linted and tested here so "the check build compiles" is
      # a fact CI maintains rather than a claim made once.
      - name: check build (instrumented)
        run: |
          cargo build --package odina-cli --features instrument --locked
          cargo test --package odina-cli --features instrument --locked

      - name: doc
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --doc --locked
