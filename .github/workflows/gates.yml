#
# The gates that protect everything written after them. Each one exists
# because a rule in docs/spec/ is worthless if nothing enforces it.
#
#   license   LICENSING.md §4     every source file carries its SPDX tag
#   icons     design-system §8.5  no emoji as UI icons
#   contrast  design-system §2    measured WCAG ratios, both themes
#   i18n      localization §3.9   key parity, variables, layout growth
#   pseudo    localization §3.9.5 +40% stress locale still builds
#   fonts     docs/cdn-fonts.md   manifest hashes match the vendored files
#   docs      this file           internal links resolve
#   public    §34.3 rule 4        the public build links no measurement code

name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [license, icons, contrast, i18n, pseudo, fonts, docs, exc-ui, ui-law, loc-js, site, repair-pkg, rust-syn, public]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: license
        if: matrix.gate == 'license'
        run: python3 tools/ci/check-license.py

      - name: icons
        if: matrix.gate == 'icons'
        run: python3 tools/ci/check-no-emoji.py

      - name: contrast
        if: matrix.gate == 'contrast'
        run: python3 tools/ci/check-contrast.py

      - name: i18n
        if: matrix.gate == 'i18n'
        run: python3 tools/i18n-lint.py

      - name: pseudo
        if: matrix.gate == 'pseudo'
        run: |
          python3 tools/pseudo-localize.py --check
          python3 tools/pseudo-localize.py
          test -s locales/qps/odina.ftl

      - name: fonts
        if: matrix.gate == 'fonts'
        run: python3 tools/ci/check-fonts.py

      - name: docs
        if: matrix.gate == 'docs'
        run: python3 tools/ci/check-docs.py

      - name: exc-ui
        if: matrix.gate == 'exc-ui'
        run: python3 tools/ci/check-exception-ui.py

      # The UI constitution is enforced on the page, not in the spec: a rule
      # that only lives in prose is a rule nobody can fail.
      - name: ui-law
        if: matrix.gate == 'ui-law'
        run: python3 tools/ci/check-ui-constitution.py

      # locales.js is generated from the .ftl files; a stale copy would show a
      # reviewer strings that are no longer what ships.
      - name: loc-js
        if: matrix.gate == 'loc-js'
        run: python3 tools/gen-locale-js.py --check

      # Static checks cannot tell whether a packaged page boots. No Firebase
      # account or deployment: exercise only the staged files in Chromium.
      - name: site
        if: matrix.gate == 'site'
        run: |
          python3 tools/deploy-site.py --dry-run
          python3 -m pip install -r tools/ci/requirements-site.txt
          if ! command -v google-chrome >/dev/null; then
            python3 -m playwright install --with-deps --only-shell chromium
          fi
          python3 tools/ci/test-site.py

      - name: repair-pkg
        if: matrix.gate == 'repair-pkg'
        run: python3 tools/ci/test-repair-package.py

      - name: rust-syn
        if: matrix.gate == 'rust-syn'
        run: python3 tools/check-rust-syntax.py

      # The only gate that needs cargo, because half its value is the real
      # dependency graph: `cargo tree` reports what would be linked, while the
      # source can claim anything.
      - name: public
        if: matrix.gate == 'public'
        run: |
          python3 tools/ci/check-public-build.py
          cargo tree -p odina-cli --edges normal | tee /tmp/public-tree.txt
          ! grep -E 'odina-(report|instrument) v' /tmp/public-tree.txt
