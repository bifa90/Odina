#
# Temporary maintenance job: formats the workspace on a runner that has a
# toolchain. The development machine has neither cargo nor a route to
# crates.io, so `cargo fmt` cannot run there. Deleted once it has done its job.

name: fmt-fix

on:
  push:
    paths:
      - '.github/workflows/fmt-fix.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: format
        run: cargo fmt --all

      - name: commit if anything changed
        run: |
          git config user.name  "odina-bot"
          git config user.email "bifa90@users.noreply.github.com"
          if git diff --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git add -A
          git commit -m "style(rust): cargo fmt (CI)"
          git push
