#
# One-off maintenance job. It exists because the machine this project is being
# written on has no Rust toolchain and no route to crates.io — so `cargo fmt`
# and `cargo generate-lockfile` cannot run there. Instead of hand-guessing
# formatting, the CI runner does it and commits the result.
#
# Run it from the Actions tab (workflow_dispatch) and delete it once the
# lockfile and the formatting are in place. It is not part of any gate.

name: fmt-fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: format
        run: cargo fmt --all

      - name: generate lockfile
        run: cargo generate-lockfile

      - name: commit if anything changed
        run: |
          git config user.name  "odina-bot"
          git config user.email "bifa90@users.noreply.github.com"
          if git diff --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git add -A
          git commit -m "chore(rust): cargo fmt + generated Cargo.lock (CI)"
          git push
