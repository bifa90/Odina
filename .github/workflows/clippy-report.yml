#
# TEMPORARY. The sandbox writing this branch has no Rust toolchain and cannot
# read job logs. Check-run annotations are the one readable channel; they
# truncate at a newline and cap at 10 per step, so the report is newline-joined
# with a marker and split across steps. Deleted as soon as this is green.

name: clippy-report

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  report:
    name: clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: clippy workspace
        continue-on-error: true
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings > /tmp/c1.txt 2>&1 || true
          python3 - <<'PY'
          import pathlib
          body = pathlib.Path('/tmp/c1.txt').read_text(errors='replace').replace('\x1b', '')
          keep = [l for l in body.splitlines() if l.startswith(('error', 'warning')) or l.lstrip().startswith('-->')]
          print(keep[:8])
          joined = ' <<<NL>>> '.join(keep[:8]) if keep else 'CLEAN'
          pathlib.Path('/tmp/a.txt').write_text(joined[:1400], encoding='utf-8')
          PY
          echo "::error::A1 $(cat /tmp/a.txt)"

      - name: clippy instrument
        continue-on-error: true
        run: |
          cargo clippy --package odina-cli --features instrument --all-targets --locked -- -D warnings > /tmp/c2.txt 2>&1 || true
          python3 - <<'PY'
          import pathlib
          body = pathlib.Path('/tmp/c2.txt').read_text(errors='replace').replace('\x1b', '')
          keep = [l for l in body.splitlines() if l.startswith(('error', 'warning')) or l.lstrip().startswith('-->')]
          print(keep[:8])
          joined = ' <<<NL>>> '.join(keep[:8]) if keep else 'CLEAN'
          pathlib.Path('/tmp/b.txt').write_text(joined[:1400], encoding='utf-8')
          PY
          echo "::error::B1 $(cat /tmp/b.txt)"

      - name: version and raw tail
        continue-on-error: true
        run: |
          echo "::error::VER $(rustc --version) clippy $(cargo clippy --version)"
          tail -c 800 /tmp/c.txt | tr '\n' '|' | sed 's/^/::error::RAW /'

      - name: emit 0
        continue-on-error: true
        run: echo "::error::P000 $(cat /tmp/chunks/000)"

      - name: emit 1
        continue-on-error: true
        run: |
          for i in 001 002 003 004 005 006 007 008 009; do
            [ -f /tmp/chunks/$i ] && echo "::error::P$i $(cat /tmp/chunks/$i)" || true
          done

      - name: emit 2
        continue-on-error: true
        run: |
          for i in 010 011 012 013 014 015 016 017 018 019; do
            [ -f /tmp/chunks/$i ] && echo "::error::P$i $(cat /tmp/chunks/$i)" || true
          done
