# Temporary: the sandbox cannot read Actions logs, so the runner writes the
# output into the repo where it can be read. Deleted once the build is green.

name: diag

on:
  push:
    paths:
      - '.github/workflows/diag.yml'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: collect
        run: |
          {
            echo "=== test ==="
            cargo test --workspace --locked 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tail -60
          } > diag.txt 2>&1
          echo done
      - name: commit
        run: |
          git config user.name "odina-bot"
          git config user.email "bifa90@users.noreply.github.com"
          git add diag.txt
          git commit -m "chore: test diagnostics (CI)" || exit 0
          git push
