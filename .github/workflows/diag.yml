# Temporary: the sandbox cannot read Actions logs, so the runner writes the
# output into the repo where it can be read. Deleted once the build is green.
#
# This workflow deliberately does NOT fail: its job is to record what broke.
# rust.yml remains the gate that must go red when something is wrong.

name: diag

on:
  push:
    paths:
      - '.github/workflows/diag.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: collect
        shell: bash
        run: |
          {
            echo "=== versions ==="
            rustc -Vv
            cargo -V
            echo
            echo "=== fmt ==="
            cargo fmt --all -- --check 2>&1 || true
            echo
            echo "=== clippy (locked) ==="
            cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 || true
            echo
            echo "=== test (locked, no fail fast) ==="
            cargo test --workspace --locked --no-fail-fast -- --nocapture 2>&1 || true
          } > diag.txt 2>&1

      - name: commit
        shell: bash
        run: |
          git config user.name "odina-bot"
          git config user.email "bifa90@users.noreply.github.com"
          git add -A
          git commit -m "chore: test diagnostics (CI)" || exit 0
          git push
