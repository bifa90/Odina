# Temporary diagnostic workflow: prints the real rustfmt/clippy/test output and
# uploads the logs, because job logs are not readable from this environment.
# Delete before merge.
name: probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: run and capture
        run: |
          set +e
          cargo fmt --all -- --check > fmt.log 2>&1
          echo "FMT_EXIT=$?"
          cargo clippy --workspace --all-targets --all-features -- -D warnings > clippy.log 2>&1
          echo "CLIPPY_EXIT=$?"
          cargo test --workspace > test.log 2>&1
          echo "TEST_EXIT=$?"
          echo "=== FMT ==="
          head -c 6000 fmt.log
          echo "=== CLIPPY ==="
          head -c 6000 clippy.log
          echo "=== TEST ==="
          tail -c 3000 test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-logs
          path: "*.log"
