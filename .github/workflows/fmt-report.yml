#
# TEMPORARY. The sandbox writing this branch has no Rust toolchain, and job
# logs and artifacts are unreachable from it. Check-run annotations are the one
# readable channel; they truncate at a newline and cap at 10 per step, so the
# report is newline-joined with a marker and split across steps.
# Deleted as soon as the branch is green.

name: fmt-report

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/3113ebbf-odina'

permissions:
  contents: read

jobs:
  report:
    name: format and lint
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci-skip]')"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: collect
        run: |
          cargo clippy --workspace --all-targets -- -D warnings > /tmp/clippy.txt 2>&1 || true
          cargo clippy -p odina-cli --features instrument --all-targets -- -D warnings > /tmp/instr.txt 2>&1 || true
          cat > /tmp/split.py <<'PY'
          import pathlib

          SEP = ' <<<NL>>> '
          lines = []
          for tag, path in (('CLIPPY', '/tmp/clippy.txt'), ('INSTR', '/tmp/instr.txt')):
              body = pathlib.Path(path).read_text(encoding='utf-8', errors='replace')
              body = body.replace('\x1b', '')
              keep = [l for l in body.splitlines()
                      if l.startswith(('error', 'warning')) or l.lstrip().startswith('-->')]
              lines.append('==== %s (%d lines) ====' % (tag, len(keep)))
              lines.extend(keep)
          joined = SEP.join(lines)
          out = pathlib.Path('/tmp/chunks'); out.mkdir(exist_ok=True)
          pieces = [joined[i:i + 1100] for i in range(0, len(joined), 1100)]
          for i, piece in enumerate(pieces):
              (out / ('%03d' % i)).write_text(piece.replace('\n', ' '), encoding='utf-8')
          print(len(pieces), 'pieces')
          PY
          python3 /tmp/split.py
          ls /tmp/chunks | wc -l


      - name: emit 0
        run: |
          for i in 0 1 2 3 4; do
            f=$(printf '/tmp/chunks/%%03d' "$i")
            [ -f "$f" ] && echo "::error::P$(printf '%%03d' "$i") $(cat "$f")"
          done

      - name: emit 1
