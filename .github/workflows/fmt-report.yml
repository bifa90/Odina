#
# TEMPORARY. Exists for one reason: the sandbox writing this branch cannot
# download job logs, so the compiler output is committed back to the branch
# through the contents API (curl + the run's own token) instead. It is deleted
# as soon as the output has been read, and it never runs on main.

name: fmt-report

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/3113ebbf-odina'

jobs:
  report:
    name: report fmt + clippy
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci-skip]')"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # GitHub turns `::error::` lines into check-run annotations, which the API
      # returns even when job logs are unreachable. The cap is 10 per step, so
      # each diagnostic gets its own step and the list is trimmed.

      - name: fmt writes
        continue-on-error: true
        run: |
          cargo fmt --all
          git diff --no-color --stat
          git diff --no-color > /tmp/fmt.diff || true
          wc -l < /tmp/fmt.diff | sed 's/^/::error::DIFFLINES /'

      - name: clippy now
        continue-on-error: true
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --offline -- -D warnings > /tmp/c.txt 2>&1 || true
          echo "clippy lines: $(grep -cE '^(error|warning)' /tmp/c.txt || true)"
          grep -E '^(error|warning)' /tmp/c.txt | head -6 | cut -c1-185 | while read -r x; do echo "::error::C $x"; done
          grep -E '^ *--> ' /tmp/c.txt | head -6 | while read -r x; do echo "::error::AT $x"; done

      - name: instrument now
        continue-on-error: true
        run: |
          cargo clippy -p odina-cli --features instrument --all-targets --offline -- -D warnings > /tmp/i.txt 2>&1 || true
          echo "inst lines: $(grep -cE '^(error|warning)' /tmp/i.txt || true)"
          grep -E '^(error|warning)' /tmp/i.txt | head -6 | cut -c1-185 | while read -r x; do echo "::error::I $x"; done
          grep -E '^ *--> ' /tmp/i.txt | head -6 | while read -r x; do echo "::error::IAT $x"; done

      - name: collected
        run: echo "report complete"
