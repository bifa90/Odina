#
# TEMPORARY. The sandbox writing this branch has no Rust toolchain, and job
# logs and artifacts are unreachable from it. Check-run annotations are the one
# readable channel; they truncate at a newline and cap at 10 per step, so the
# report is newline-joined with a marker and split across steps.
# Deleted as soon as the branch is green.

name: fmt-report

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/3113ebbf-odina'

permissions:
  contents: read

jobs:
  report:
    name: format and lint
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[ci-skip]')"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy on windows
        continue-on-error: true
        shell: pwsh
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings *> c1.txt
          $tail = (Get-Content c1.txt -Tail 45) -join " <NL> "
          Write-Output "::error::W1 $tail"
          cargo clippy --package odina-cli --features instrument --all-targets --locked -- -D warnings *> c2.txt
          $tail2 = (Get-Content c2.txt -Tail 45) -join " <NL> "
          Write-Output "::error::W2 $tail2"
