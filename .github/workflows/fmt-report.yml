#
# TEMPORARY. This file exists for one reason: the sandbox that writes this
# branch cannot download job logs (the results blob store is unreachable), so
# the compiler output is committed back to the branch instead. It is deleted as
# soon as the failures are fixed, and it never runs on main.

name: fmt-report

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/3113ebbf-odina'

permissions:
  contents: write

jobs:
  report:
    name: report fmt + clippy
    runs-on: ubuntu-latest
    # Never loop: the commit this job makes carries a skip marker in its body.
    if: "!contains(github.event.head_commit.message, '[ci-skip]')"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: collect
        run: |
          {
            echo "=== rustfmt --check ==="
            cargo fmt --all -- --check 2>&1 || true
            echo
            echo "=== rustfmt --check on the check build ==="
            cargo fmt --all -- --check --features instrument 2>&1 || true
            echo
            echo "=== clippy (default) ==="
            cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 || true
            echo
            echo "=== clippy (instrument) ==="
            cargo clippy --package odina-cli --features instrument --all-targets --locked -- -D warnings 2>&1 || true
          } > fmt-report.txt
          wc -l fmt-report.txt

      - name: commit the report
        run: |
          if [ -f fmt-report.txt ]; then
            git config user.name "odina-bot"
            git config user.email "bifa90@users.noreply.github.com"
            git add fmt-report.txt
            git diff --cached --quiet || git commit -m "ci: compiler report [ci-skip]"
            git push
          fi
