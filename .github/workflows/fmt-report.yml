#
# TEMPORARY. Exists for one reason: the sandbox writing this branch cannot
# download job logs, so the compiler output is committed back to the branch
# through the contents API (curl + the run's own token) instead. It is deleted
# as soon as the output has been read, and it never runs on main.

name: fmt-report

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/3113ebbf-odina'

jobs:
  report:
    name: report fmt + clippy
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci-skip]')"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # GitHub turns `::error::` lines into check-run annotations, which the API
      # returns even when job logs are unreachable. The cap is 10 per step, so
      # each diagnostic gets its own step and the list is trimmed.
      - name: cargo update (writes the lock on the runner only)
        continue-on-error: true
        run: |
          cargo update --offline 2>&1 | tail -5 || cargo update 2>&1 | tail -5
          git diff --stat Cargo.lock

      - name: fmt (real, gives line numbers)
        continue-on-error: true
        run: |
          cargo fmt --all -- --check 2>&1 | grep -E '^Diff in' | head -10 | while read -r l; do echo "::error::FMT $l"; done
          echo done

      - name: clippy (real)
        continue-on-error: true
        run: |
          cargo clippy --workspace --all-targets -- -D warnings > /tmp/c.txt 2>&1 || true
          echo "lint lines: $(grep -cE '^(error|warning)' /tmp/c.txt || true)"
          grep -E '^(error|warning)' /tmp/c.txt | head -8 | cut -c1-190 | while read -r l; do echo "::error::C $l"; done
          grep -E '^ *--> ' /tmp/c.txt | head -8 | while read -r l; do echo "::error::AT $l"; done

      - name: clippy (instrument)
        continue-on-error: true
        run: |
          cargo clippy -p odina-cli --features instrument --all-targets -- -D warnings > /tmp/i.txt 2>&1 || true
          echo "inst lines: $(grep -cE '^(error|warning)' /tmp/i.txt || true)"
          grep -E '^(error|warning)' /tmp/i.txt | head -8 | cut -c1-190 | while read -r l; do echo "::error::I $l"; done
          grep -E '^ *--> ' /tmp/i.txt | head -8 | while read -r l; do echo "::error::IAT $l"; done

      - name: collected
        run: echo "report complete"
