          sed -n '169,180p' /tmp/fmt.diff | while read -r l; do echo "::error::D $l"; done

      - name: d15
        continue-on-error: true
        run: |
          sed -n '181,192p' /tmp/fmt.diff | while read -r l; do echo "::error::D $l"; done

      - name: d16
        continue-on-error: true
        run: |
          sed -n '193,204p' /tmp/fmt.diff | while read -r l; do echo "::error::D $l"; done

      - name: d17
        continue-on-error: true
        run: |
          sed -n '205,216p' /tmp/fmt.diff | while read -r l; do echo "::error::D $l"; done

      - name: d18
        continue-on-error: true
