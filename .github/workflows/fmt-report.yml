#
# TEMPORARY. The sandbox that writes this branch has no Rust toolchain and
# cannot reach the log store, so this job runs `cargo fmt` and `clippy`, then
# writes the results back to the branch through the contents API. Deleted as
# soon as the branch is green.

name: fmt-report

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/3113ebbf-odina'

jobs:
  report:
    name: format and lint
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci-skip]')"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: format, verify, and publish as an artifact
        run: |
          cargo fmt --all
          git diff --stat
          cargo clippy --workspace --all-targets -- -D warnings > /tmp/c.txt 2>&1 || true
          cargo clippy -p odina-cli --features instrument --all-targets -- -D warnings > /tmp/i.txt 2>&1 || true
          grep -E '^(error|warning)' /tmp/c.txt /tmp/i.txt | head -20 > summary.txt || true
          # Fail the step if clippy is unhappy, so the job status means something.
          ! grep -qE '^(error)' /tmp/c.txt /tmp/i.txt
