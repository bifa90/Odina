#
# TEMPORARY. The sandbox writing this branch has no Rust toolchain, and job
# logs and artifacts are both unreachable from it. Check-run annotations are
# the one readable channel, so this job dumps the rustfmt diff and the clippy
# diagnostics into single, newline-escaped annotations. Deleted when green.

name: fmt-report

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/3113ebbf-odina'

permissions:
  contents: read

jobs:
  report:
    name: format and lint
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci-skip]')"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: collect
        run: |
          cargo fmt --all
          git diff --no-color > /tmp/fmt.diff || true
          cargo clippy --workspace --all-targets -- -D warnings > /tmp/c.txt 2>&1 || true
          cargo clippy -p odina-cli --features instrument --all-targets -- -D warnings > /tmp/i.txt 2>&1 || true
          cat > /tmp/emit.py <<'PY'
          import pathlib, sys

          def esc(text):
              return (text.replace('%', '%25')
                          .replace('\r', '%0D')
                          .replace('\n', '%0A'))

          def emit(tag, path, limit):
              p = pathlib.Path(path)
              if not p.exists():
                  print('::error::' + tag + ' MISSING')
                  return
              body = p.read_text(encoding='utf-8', errors='replace')[:limit]
              print('::error::' + tag + ' ' + esc(body))

          emit('FMT', '/tmp/fmt.diff', 12000)
          emit('CLIPPY', '/tmp/c.txt', 12000)
          emit('INSTR', '/tmp/i.txt', 12000)
          PY
          python3 /tmp/emit.py
