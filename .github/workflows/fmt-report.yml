#
# TEMPORARY. Exists for one reason: the sandbox writing this branch cannot
# download job logs, so the compiler output is committed back to the branch
# through the contents API (curl + the run's own token) instead. It is deleted
# as soon as the output has been read, and it never runs on main.

name: fmt-report

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/3113ebbf-odina'

jobs:
  report:
    name: report fmt + clippy
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci-skip]')"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # GitHub turns `::error::` lines into check-run annotations, which the API
      # returns even when job logs are unreachable. The cap is 10 per step, so
      # each diagnostic gets its own step and the list is trimmed.

      - name: fmt writes
        continue-on-error: true
        run: |
          cargo fmt --all
          git diff --no-color --stat
          git diff --no-color > /tmp/fmt.diff || true
          wc -l < /tmp/fmt.diff | sed 's/^/::error::DIFFLINES /'

      - name: fmt diff 0
        continue-on-error: true
        run: |
          sed -n '1,12p' /tmp/fmt.diff | while read -r l; do echo "::error::D $l"; done

      - name: fmt diff 1
        continue-on-error: true
        run: |
          sed -n '13,24p' /tmp/fmt.diff | while read -r l; do echo "::error::D $l"; done

      - name: fmt diff 2
        continue-on-error: true
        run: |
          sed -n '25,36p' /tmp/fmt.diff | while read -r l; do echo "::error::D $l"; done

      - name: fmt diff 3
        continue-on-error: true
        run: |
          sed -n '37,48p' /tmp/fmt.diff | while read -r l; do echo "::error::D $l"; done

      - name: fmt diff 4
        continue-on-error: true
        run: |
          sed -n '49,60p' /tmp/fmt.diff | while read -r l; do echo "::error::D $l"; done

      - name: fmt diff 5
        continue-on-error: true
        run: |
          sed -n '61,72p' /tmp/fmt.diff | while read -r l; do echo "::error::D $l"; done

      - name: fmt diff 6
        continue-on-error: true
        run: |
          sed -n '73,84p' /tmp/fmt.diff | while read -r l; do echo "::error::D $l"; done

      - name: fmt diff 7
        continue-on-error: true
        run: |
          sed -n '85,96p' /tmp/fmt.diff | while read -r l; do echo "::error::D $l"; done

      - name: fmt diff 8
        continue-on-error: true
        run: |
          sed -n '97,108p' /tmp/fmt.diff | while read -r l; do echo "::error::D $l"; done

      - name: fmt diff 9
        continue-on-error: true
        run: |
          sed -n '109,120p' /tmp/fmt.diff | while read -r l; do echo "::error::D $l"; done
      - name: collected
        run: echo "report complete"
