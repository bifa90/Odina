#
# TEMPORARY. The sandbox that writes this branch has no Rust toolchain and
# cannot read job logs, so this job writes everything into one artifact, which
# is downloadable through the API. Deleted as soon as the branch is green.

name: fmt-report

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/3113ebbf-odina'

permissions:
  contents: read

jobs:
  report:
    name: format and lint
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci-skip]')"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: collect
        run: |
          {
            echo "########## rustfmt ##########"
            cargo fmt --all -- --check 2>&1 || true
            echo
            echo "########## clippy default ##########"
            cargo clippy --workspace --all-targets -- -D warnings 2>&1 || true
            echo
            echo "########## clippy instrument ##########"
            cargo clippy -p odina-cli --features instrument --all-targets -- -D warnings 2>&1 || true
          } > report.txt
          wc -c report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.txt
          retention-days: 1
