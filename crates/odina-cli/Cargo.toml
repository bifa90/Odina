[package]
name = "odina-cli"
description = "Scan one file and print the decision. This is gate G1."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "odina"
path = "src/main.rs"

[dependencies]
odina-core = { path = "../odina-core" }
# Optional on purpose: the public build must not merely avoid calling this
# code, it must not contain it. `cargo tree` on a default build shows neither
# crate below, which is what `tools/ci/check-public-build.py` asserts.
odina-report = { path = "../odina-report", optional = true }
odina-instrument = { path = "../odina-instrument", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# fstatfs on the already-open file: never reuse hints on synthetic/remote FS.
libc = { version = "0.2", optional = true }

[features]
default = []
# The only difference between the two builds is this flag. There is no second
# source tree, no fork, and no patched copy.
instrument = ["odina-report", "odina-instrument", "dep:libc"]

[dev-dependencies]
# The unit tests of the export path need the report writer even when the
# feature is off, so the tests exercise the same code the check build ships.
odina-report = { path = "../odina-report" }
