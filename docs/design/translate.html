<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odina — محرّر الترجمة</title>
<style>
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --surface2:#EFF1F4; --code:#EFF1F4;
  --text:#14181C; --text2:#4A5560; --text3:#5F6B77;
  --accent:#0E7C6B; --ok:#157A4B; --warn:#8A5200; --danger:#B3261E; --focus:#0B5FFF;
  --border:rgba(20,24,28,.12); --radius:8px; --r-sm:4px;
  --ff:'IBM Plex Sans Arabic','Inter','Segoe UI',system-ui,sans-serif;
  --mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
}
html[data-theme="dark"]{
  --bg:#1B1D20; --surface:#24272B; --surface2:#2C3035; --code:#2C3035;
  --text:#F2F4F6; --text2:#B7C0C8; --text3:#8D99A4;
  --accent:#3FC7B0; --ok:#4ED08A; --warn:#E0A33A; --danger:#FF7B72; --focus:#8AB4FF;
  --border:rgba(242,244,246,.14);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ff);line-height:1.55}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:17px;margin:0;font-weight:600}
.top .spacer{flex:1}
.top label{font-size:13px;color:var(--text2);display:flex;gap:6px;align-items:center}
select,input[type=search]{font:inherit;font-size:13px;padding:6px 8px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--surface);color:var(--text)}
button{font:inherit;cursor:pointer;border-radius:var(--r-sm);padding:6px 12px;font-size:13px;
  border:1px solid var(--border);background:var(--surface);color:var(--text)}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
html[data-theme="dark"] button.primary{color:#0B1416}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:18px}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text2);margin-bottom:12px}
.stats b{color:var(--text);font-weight:600}
.progress{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.screen{margin:26px 0 8px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
.screen span{font-size:12px;color:var(--text3);font-weight:400}
.row{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);
  padding:12px 14px;margin-bottom:8px}
.row.dirty{border-inline-start:3px solid var(--warn)}
.row.bad{border-inline-start:3px solid var(--danger)}
.head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.key{font-family:var(--mono);font-size:12px;color:var(--text3);direction:ltr;unicode-bidi:isolate}
.vars{font-family:var(--mono);font-size:11px;color:var(--accent);direction:ltr;unicode-bidi:isolate}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.col label{display:block;font-size:11px;color:var(--text3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px}
.ref{font-size:14px;color:var(--text2);min-height:1em}
textarea{width:100%;font:inherit;font-size:14px;padding:8px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--bg);color:var(--text);resize:vertical;min-height:52px}
textarea:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:transparent}
.row.bad textarea{border-color:var(--danger)}
.msg{font-size:12px;color:var(--danger);margin-top:4px;display:none}
.row.bad .msg{display:block}
.foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);
  padding:10px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.foot .spacer{flex:1}
.foot .hint{color:var(--text2);font-size:12px}
.dlg{border:0;border-radius:12px;padding:0;max-width:640px;width:92vw;background:var(--surface);color:var(--text)}
.dlg::backdrop{background:rgba(10,20,30,.45)}
.dlg .in{padding:18px}
.dlg h2{margin:0 0 6px;font-size:17px}
.dlg p{margin:0 0 12px;font-size:13px;color:var(--text2)}
.dlg pre{background:var(--code);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:10px;font-family:var(--mono);font-size:12px;max-height:42vh;overflow:auto;
  direction:ltr;text-align:left;white-space:pre}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;padding:0 18px 18px}
.empty{color:var(--text3);font-size:14px;padding:30px 0;text-align:center}
</style>
</head>
<body>

<div class="top">
  <h1>محرّر الترجمة</h1>
  <label>اللغة
    <select id="lang"></select>
  </label>
  <label>بحث
    <input id="q" type="search" placeholder="مفتاح أو نص" style="width:180px">
  </label>
  <label><input id="onlyTodo" type="checkbox"> الناقص فقط</label>
  <span class="spacer"></span>
  <button id="theme">الوضع الداكن</button>
  <button id="export" class="primary">تنزيل odina.ftl</button>
</div>

<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="progress"><i id="bar"></i></div>
  <div id="list"></div>
</div>

<div class="foot">
  <span class="hint" id="footHint">التعديلات تُحفظ في هذا المتصفح تلقائيًا · الملف لا يخرج من جهازك حتى تنزّله</span>
  <span class="spacer"></span>
  <button id="reset">إلغاء تعديلات هذه اللغة</button>
  <button id="preview">معاينة الملف</button>
</div>

<dialog class="dlg" id="dlg">
  <div class="in">
    <h2 id="dlgTitle">معاينة</h2>
    <p id="dlgSub"></p>
    <pre id="dlgBody" dir="ltr"></pre>
  </div>
  <div class="acts">
    <button id="dlgClose">إغلاق</button>
    <button id="dlgSave" class="primary">تنزيل</button>
  </div>
</dialog>

<script>
"use strict";

const S = window.__ODINA_EDITOR__;
if (!S) {
  document.body.innerHTML = '<p style="padding:24px">لم تُضمَّن البيانات — أعد توليد الملف بالأداة.</p>';
  throw new Error('editor data missing');
}

const VAR = /\{\s*\$([A-Za-z0-9_]+)\s*\}/g;
const storeKey = lang => 'odina.translate.' + lang;

/** Keys edited in this browser for one language: {key: text}. */
function load(lang) {
  try { return JSON.parse(localStorage.getItem(storeKey(lang)) || '{}'); }
  catch { return {}; }
}
function save(lang, edits) {
  localStorage.setItem(storeKey(lang), JSON.stringify(edits));
}

let lang = S.reference;
let edits = {};

const el = id => document.getElementById(id);

function valueOf(key) {
  if (Object.prototype.hasOwnProperty.call(edits, key)) return edits[key];
  return (S.strings[lang] && S.strings[lang][key]) || '';
}
function referenceOf(key) {
  return S.strings[S.reference][key] || '';
}
function baseOf(key) {
  return S.strings[S.layout_base] && S.strings[S.layout_base][key]
    || S.strings[S.reference][key] || '';
}

/** The two defects the linter would otherwise find a day later. */
function problem(key, text) {
  if (!text.trim()) return '';
  const braces = (text.match(/\{/g) || []).length - (text.match(/\}/g) || []).length;
  if (braces !== 0) return 'أقواس غير متوازنة — Fluent سيرفض هذا السطر';

  const want = new Set();
  referenceOf(key).replace(VAR, (_, name) => want.add(name));
  const have = new Set();
  text.replace(VAR, (_, name) => have.add(name));

  const missing = [...want].filter(v => !have.has(v));
  const extra = [...have].filter(v => !want.has(v));
  if (missing.length) return 'متغيّر ضائع: ' + missing.map(v => '$' + v).join(', ');
  if (extra.length) return 'متغيّر غير معروف: ' + extra.map(v => '$' + v).join(', ');
  return '';
}

function screenLabel(id) {
  const found = S.screens.find(s => s.id === id);
  return found ? found.label : id;
}

function render() {
  const q = el('q').value.trim().toLowerCase();
  const onlyTodo = el('onlyTodo').checked;
  const list = el('list');
  list.innerHTML = '';

  let shown = 0;

  for (const screen of S.screens) {
    const keys = S.keys.filter(k => k.screen === screen.id);
    if (!keys.length) continue;

    const block = document.createElement('section');
    const title = document.createElement('h2');
    title.className = 'screen';
    title.textContent = screen.label;
    const count = document.createElement('span');
    title.appendChild(count);
    block.appendChild(title);

    let added = 0;
    for (const entry of keys) {
      const key = entry.key;
      const text = valueOf(key);
      const ref = referenceOf(key);
      const base = baseOf(key);

      if (q) {
        const hay = (key + ' ' + ref + ' ' + base + ' ' + text).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      if (onlyTodo && text.trim()) continue;

      const row = document.createElement('div');
      row.className = 'row';
      if (Object.prototype.hasOwnProperty.call(edits, key)) row.classList.add('dirty');

      const head = document.createElement('div');
      head.className = 'head';
      const k = document.createElement('span');
      k.className = 'key';
      k.textContent = key;
      head.appendChild(k);
      if (entry.vars.length) {
        const v = document.createElement('span');
        v.className = 'vars';
        v.textContent = entry.vars.map(x => '$' + x).join(' ');
        head.appendChild(v);
      }
      row.appendChild(head);

      const cols = document.createElement('div');
      cols.className = 'cols';

      const c1 = document.createElement('div');
      c1.className = 'col';
      const l1 = document.createElement('label');
      l1.textContent = 'المرجع (' + S.reference + ')';
      const r1 = document.createElement('div');
      r1.className = 'ref';
      r1.textContent = ref;
      c1.appendChild(l1); c1.appendChild(r1);

      const c2 = document.createElement('div');
      c2.className = 'col';
      const l2 = document.createElement('label');
      l2.textContent = 'الترجمة (' + lang + ')';
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.rows = Math.max(2, Math.ceil((base.length || ref.length) / 48));
      ta.spellcheck = false;
      ta.addEventListener('input', () => {
        const v = ta.value;
        if (v === ((S.strings[lang] && S.strings[lang][key]) || '')) delete edits[key];
        else edits[key] = v;
        save(lang, edits);
        const err = problem(key, v);
        row.classList.toggle('bad', !!err);
        msg.textContent = err;
        row.classList.toggle('dirty', Object.prototype.hasOwnProperty.call(edits, key));
        updateStats();
      });
      const msg = document.createElement('div');
      msg.className = 'msg';
      const initial = problem(key, text);
      if (initial) { row.classList.add('bad'); msg.textContent = initial; }
      c2.appendChild(l2); c2.appendChild(ta); c2.appendChild(msg);

      cols.appendChild(c1); cols.appendChild(c2);
      row.appendChild(cols);
      block.appendChild(row);
      added++; shown++;
    }

    if (added) {
      count.textContent = added + ' مفتاحًا';
      list.appendChild(block);
    }
  }

  if (!shown) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = q || onlyTodo ? 'لا مفتاح يطابق الشرط.' : 'لا مفاتيح.';
    list.appendChild(p);
  }

  updateStats();
}

function updateStats() {
  const total = S.keys.length;
  let done = 0, bad = 0;
  for (const k of S.keys) {
    const t = valueOf(k.key);
    if (t.trim()) done++;
    if (problem(k.key, t)) bad++;
  }
  el('stats').innerHTML =
    '<span>اللغة: <b>' + lang + '</b></span>' +
    '<span>المفاتيح: <b>' + total + '</b></span>' +
    '<span>المترجَم: <b>' + done + '</b></span>' +
    '<span>الناقص: <b>' + (total - done) + '</b></span>' +
    (bad ? '<span style="color:var(--danger)">أخطاء: <b>' + bad + '</b></span>' : '');
  el('bar').style.width = (total ? (done / total * 100) : 0) + '%';
}

/** Fluent output, in reference order, with the original section headers. */
function toFluent() {
  const lines = [];
  const header = '## ── ' ;
  let lastSection = null;
  for (const entry of S.keys) {
    const key = entry.key;
    const text = valueOf(key);
    if (!text.trim()) continue;
    if (entry.section && entry.section !== lastSection) {
      lines.push('');
      lines.push('## ' + entry.section);
      lastSection = entry.section;
    }
    lines.push(key + ' = ' + text);
  }
  return lines.join('\n').replace(/^\n/, '') + '\n';
}

function exportFile() {
  const bad = S.keys.map(k => [k.key, problem(k.key, valueOf(k.key))]).filter(([, p]) => p);
  const body = toFluent();
  el('dlgTitle').textContent = 'odina.ftl — ' + lang;
  el('dlgSub').textContent = bad.length
    ? 'لا يمكن التنزيل: ' + bad.length + ' سطرًا فيه خطأ. أصلحها أولًا (تظهر بالأحمر).'
    : 'هذا الملف يُوضع في locales/' + lang + '/odina.ftl — البوابة تفحصه بعد ذلك.';
  el('dlgBody').textContent = bad.length
    ? bad.slice(0, 12).map(([k, p]) => k + ': ' + p).join('\n')
    : body;
  el('dlgSave').disabled = bad.length > 0;
  el('dlg').showModal();

  el('dlgSave').onclick = () => {
    const blob = new Blob([body], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'odina.ftl';
    a.click();
    URL.revokeObjectURL(a.href);
    el('dlg').close();
  };
}

function previewOnly() {
  const body = toFluent();
  el('dlgTitle').textContent = 'معاينة — ' + lang;
  el('dlgSub').textContent = 'قراءة فقط. التنزيل من الزر في الأعلى.';
  el('dlgBody').textContent = body;
  el('dlgSave').disabled = false;
  el('dlg').showModal();
  el('dlgSave').onclick = () => el('dlg').close();
}

function switchLang(next) {
  lang = next;
  edits = load(lang);
  render();
}

function init() {
  const select = el('lang');
  for (const code of S.languages) {
    const o = document.createElement('option');
    o.value = code;
    o.textContent = code + (code === S.reference ? ' (مرجع)' : '');
    select.appendChild(o);
  }
  select.value = lang;
  select.addEventListener('change', () => switchLang(select.value));

  el('q').addEventListener('input', render);
  el('onlyTodo').addEventListener('change', render);
  el('export').addEventListener('click', exportFile);
  el('preview').addEventListener('click', previewOnly);
  el('dlgClose').addEventListener('click', () => el('dlg').close());

  el('reset').addEventListener('click', () => {
    if (!confirm('إلغاء كل تعديلات هذه اللغة في هذا المتصفح؟')) return;
    edits = {};
    localStorage.removeItem(storeKey(lang));
    render();
  });

  el('theme').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme === 'dark';
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    el('theme').textContent = dark ? 'الوضع الداكن' : 'الوضع الفاتح';
  });

  if (S.reference !== 'ar') document.documentElement.dir = 'rtl';

  render();
}

init();
</script>
</body>
